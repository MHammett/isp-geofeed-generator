name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wordpress-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql mariadb-server openssl
      - run: sudo systemctl start mariadb
      - run: python -m pip install --no-deps . ./examples/local-extension && python -m pip install -r requirements.txt
      - run: python tests/wordpress/run.py
  independent-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: |
          git clone --no-checkout --depth 1 https://github.com/massimocandela/geofeed-validator.git "$RUNNER_TEMP/candela"
          git -C "$RUNNER_TEMP/candela" fetch --depth 1 origin ede8916ee1045fa806554bb76112d0fecc63b40d
          git -C "$RUNNER_TEMP/candela" checkout --detach ede8916ee1045fa806554bb76112d0fecc63b40d
          cd "$RUNNER_TEMP/candela"
          npm ci --omit=dev --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=low
      - run: |
          python tests/stage_external_tools.py --directory "$RUNNER_TEMP/conformance-tools"
          python tests/check_external_conformance.py --candela "$RUNNER_TEMP/candela" --maxmind "$RUNNER_TEMP/conformance-tools/mm-geofeed-verifier" --output "$RUNNER_TEMP/conformance-report.json"
  systemd-credentials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y acl
      - run: sudo /usr/bin/python3 tests/check_systemd_credentials.py
  python:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps . ./examples/local-extension
      - run: python tests/check_installed.py
      - run: sudo apt-get update && sudo apt-get install -y php-cli
      - run: REQUIRE_PHP=1 bash tests/test.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps . ./examples/local-extension
      - run: python tests/check_installed.py
      - run: python -m unittest discover -s tests -v
