[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geofeed-local-example"
version = "0.1.0"
requires-python = ">=3.11"
description = "Example external input and output adapters for ISP Geofeed Generator"

[project.entry-points."isp_geofeed_generator.sources.v1"]
local_json = "geofeed_local:SOURCE"

[project.entry-points."isp_geofeed_generator.targets.v1"]
local_file = "geofeed_local:TARGET"

[project.entry-points."isp_geofeed_generator.targets.v2"]
local_file_v2 = "geofeed_local:TARGET_V2"
